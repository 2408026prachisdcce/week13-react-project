<!DOCTYPE html>
<html>
<head>
<title>Sudoku Game</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>SUDOKO MASTER</h1>

<h3>Time: <span id="timer">00:00</span></h3>

<div id="sudoku-board"></div>

<div class="buttons">
<button onclick="checkSudoku()">Check Solution</button>
<button onclick="resetSudoku()">Reset</button>
<button onclick="startTimer()">Start Game</button>
</div>

<p id="result"></p>
<div id="celebration"></div>

<script src="script.js"></script>

</body>
</html>
